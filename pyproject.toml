[project]
name = "digest-action"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "asyncgh>=0.2.0",
  "hugoh-repokit>=0.1.0",
  "jinja2>=3.1.6",
  "rich>=13",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-httpx2>=0.1", "respx>=0.21"]

[tool.pytest.ini_options]
addopts = ["-p", "pytest_httpx2"]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
