name: digest-action
description: >-
  Build (and optionally email) an HTML digest of a GitHub account's repo
  activity -- open/closed PRs, issues, and releases.
branding:
  icon: mail
  color: blue
inputs:
  only:
    description: Comma-separated repo names to limit to (default -- every non-archived repo)
    required: false
    default: ""
  skip:
    description: Comma-separated repo names to exclude
    required: false
    default: ""
  open-days:
    description: How many days back to look for still-open PRs and issues
    required: false
    default: "365"
  closed-days:
    description: How many days back to look for closed PRs and issues
    required: false
    default: "7"
  release-days:
    description: How many days back to look for published releases
    required: false
    default: "7"
  star-days:
    description: >-
      Comma-separated windows (in days) for counting recently-gained stars
      -- one column per value in the Stars section.
    required: false
    default: "7,30"
  star-top:
    description: >-
      Always show this many most-starred repos in the Stars section, even
      with no recent gain.
    required: false
    default: "10"
  out:
    description: >-
      Path (relative to the runner's workspace) to also write the rendered
      HTML to. Sets the html output. Required if send-email is false, since
      otherwise the digest would be built and immediately discarded.
    required: false
    default: ""
  send-email:
    description: Whether to email the digest -- requires the smtp-* / digest-*-email inputs
    required: false
    default: "true"
  smtp-host:
    description: SMTP relay host. Required when send-email is true.
    required: false
    default: ""
  smtp-port:
    description: >-
      SMTP relay port. Required when send-email is true. The relay is reached
      over STARTTLS with cert and hostname verification, so use a submission
      port (typically 587), not an implicit-TLS port (465).
    required: false
    default: ""
  smtp-username:
    description: SMTP username. Required when send-email is true.
    required: false
    default: ""
  smtp-password:
    description: SMTP password -- pass as a secret. Required when send-email is true.
    required: false
    default: ""
  digest-from-email:
    description: Envelope From address. Required when send-email is true.
    required: false
    default: ""
  digest-to-email:
    description: Recipient address. Required when send-email is true.
    required: false
    default: ""
  owner:
    description: GitHub account/org to report on (default -- whoever runs the action)
    required: false
    default: ${{ github.repository_owner }}
  github-token:
    description: >-
      Token gh (and so `gh auth token`) should use -- needs read access to
      every targeted repo, and to list repos for `owner` account-wide, which
      GITHUB_TOKEN cannot do outside its own repo. Passed through as GH_TOKEN.
      A PAT is required; see the Token section of the README for the scopes.
    required: true
  uv-version:
    description: >-
      uv version to install (e.g. 0.5.0, latest, latest-known). Defaults to
      the version in pyproject.toml, or latest.
    required: false
    default: ""
outputs:
  html:
    description: Path to the rendered HTML file (set only when `out` is given)
    value: ${{ steps.render.outputs.html }}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: ${{ inputs.uv-version }}

    - id: render
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_OWNER: ${{ inputs.owner }}
        GH_MAX_RETRIES: "8"
        ONLY: ${{ inputs.only }}
        SKIP: ${{ inputs.skip }}
        OPEN_DAYS: ${{ inputs.open-days }}
        CLOSED_DAYS: ${{ inputs.closed-days }}
        RELEASE_DAYS: ${{ inputs.release-days }}
        STAR_DAYS: ${{ inputs.star-days }}
        STAR_TOP: ${{ inputs.star-top }}
        OUT: ${{ inputs.out }}
        SEND_EMAIL: ${{ inputs.send-email }}
        SMTP_HOST: ${{ inputs.smtp-host }}
        SMTP_PORT: ${{ inputs.smtp-port }}
        SMTP_USERNAME: ${{ inputs.smtp-username }}
        SMTP_PASSWORD: ${{ inputs.smtp-password }}
        DIGEST_FROM_EMAIL: ${{ inputs.digest-from-email }}
        DIGEST_TO_EMAIL: ${{ inputs.digest-to-email }}
      run: |
        set -euo pipefail
        args=(
          --open-days "$OPEN_DAYS"
          --closed-days "$CLOSED_DAYS"
          --release-days "$RELEASE_DAYS"
          --star-days "$STAR_DAYS"
          --star-top "$STAR_TOP"
        )
        [ -n "$ONLY" ] && IFS=',' read -ra only_repos <<<"$ONLY" && args+=("${only_repos[@]}")
        [ -n "$SKIP" ] && args+=(--skip "$SKIP")
        [ -n "$OUT" ] && args+=(--out "$OUT")
        [ "$SEND_EMAIL" = "false" ] && args+=(--no-send)

        uv run --project "$GITHUB_ACTION_PATH" \
          "$GITHUB_ACTION_PATH/digest.py" "${args[@]}"

        if [ -n "$OUT" ]; then
          echo "html=$OUT" >> "$GITHUB_OUTPUT"
        fi
