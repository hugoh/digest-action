---
name: hk

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-caller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hk:
    uses: hugoh/gh-workflows/.github/workflows/hk.yml@1e09f883bc388f58e179d22768c320a1fe256998 # v1.40.14
    permissions:
      contents: read
      packages: read
      statuses: write
