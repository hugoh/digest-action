---
name: release

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-caller-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: hugoh/gh-workflows/.github/workflows/release.yml@12a131c8eca966fe30bcc4ca670fa596b375702f # v1.40.19
    permissions:
      contents: write
    with:
      major-tag: true
