---
name: release

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-caller-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: hugoh/gh-workflows/.github/workflows/release.yml@20f042d18e1e5318722f808bafc6d7fc18a838f7 # v1.40.17
    permissions:
      contents: write
    with:
      major-tag: true
