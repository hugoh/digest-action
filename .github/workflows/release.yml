---
name: release

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-caller-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: hugoh/gh-workflows/.github/workflows/release.yml@e16fb522310fbdff89aab38e3d16d13ee5cff11e # v1.40.20
    permissions:
      contents: write
    with:
      major-tag: true
