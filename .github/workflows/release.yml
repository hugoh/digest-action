---
name: release

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-caller-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: hugoh/gh-workflows/.github/workflows/release.yml@bbbf25812da61dd48510494ce8d6c55e6f919aa6 # v1.40.13
    permissions:
      contents: write
    with:
      major-tag: true
