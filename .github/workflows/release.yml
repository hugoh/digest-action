---
name: release

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-caller-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: hugoh/gh-workflows/.github/workflows/release.yml@ae6e1b2ce64760b5418b71668bb9b0a74a3c4c70 # v1.40.22
    permissions:
      contents: write
    with:
      major-tag: true
