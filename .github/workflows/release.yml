---
name: release

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-caller-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: hugoh/gh-workflows/.github/workflows/release.yml@1e09f883bc388f58e179d22768c320a1fe256998 # v1.40.14
    permissions:
      contents: write
    with:
      major-tag: true
